name: CI

# Lint + unit + e2e + build (+ openapi.json drift check) on every PR and every push to main.
# Deploys are NOT done here: Render auto-deploys a main commit only after these checks pass
# (render.yaml: autoDeployTrigger: checksPass). The push trigger must stay, or main commits would
# have no checks and Render would never deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Jest needs Node >= 24.9 (require(esm))
          cache: npm

      # mongodb-memory-server downloads a mongod binary (~100 MB) for the e2e suite.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: E2E tests (in-memory MongoDB)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      # The committed openapi.json is the contract the web and mobile clients generate from.
      - name: openapi.json is up to date
        run: |
          npm run openapi
          git diff --exit-code -- openapi.json || {
            echo "::error file=openapi.json::openapi.json is stale. Run 'npm run openapi' and commit it."
            exit 1
          }
