# Render Blueprint — https://render.com/docs/blueprint-spec
# Setup and every variable are explained in docs/DEPLOYMENT.md.
services:
  - type: web
    name: saiyagym-api
    runtime: node
    plan: free # sleeps after 15 min idle → cold start (see docs/DEPLOYMENT.md#cold-starts)
    region: virginia # keep it next to the Atlas cluster (AWS us-east-1)
    branch: main
    # Deploys are triggered by GitHub Actions (.github/workflows/ci.yml) only after lint, tests and
    # build pass on main — not by Render on every push.
    autoDeploy: false
    # Node version comes from .nvmrc (24.x; Nest 12 + require(esm) need >= 24.9).
    # NODE_ENV=production is also set at build time, so devDependencies (nest CLI, TypeScript)
    # must be included explicitly, then pruned to keep the runtime image small.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    # The compiled app, not `nest start`: no CLI or compiler in the cold-start path.
    startCommand: node dist/main
    # Pings MongoDB: a deploy only goes live once the API can reach Atlas.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1" # one proxy (Render) in front: req.ip = client IP for rate limiting
      - key: LOG_LEVEL
        value: info

      # --- MongoDB Atlas (production cluster, NOT the dev one) ---
      - key: MONGODB_URI
        sync: false # mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/saiyagym?retryWrites=true&w=majority

      # --- Auth ---
      - key: JWT_ACCESS_SECRET
        generateValue: true # random 256-bit value generated by Render on first deploy
      - key: APP_WEB_URL
        sync: false # https://<github-user>.github.io/<web-repo>  (email links point here)
      - key: CORS_ORIGINS
        sync: false # https://<github-user>.github.io  (origin only: scheme + host, no path)

      # --- Mail (SMTP) ---
      - key: MAIL_DRIVER
        value: smtp
      - key: MAIL_FROM
        sync: false # "SaiyaGym <no-reply@your-domain>"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # --- Cloudinary (signed uploads; all three or none) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: gymapp
